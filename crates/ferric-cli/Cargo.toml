[package]
name = "ferric-cli"
description = "The ferric binary"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ferric"
path = "src/main.rs"

[features]
default = []

backend-openai = ["ferric-provider/backend-openai", "dep:tokio"]

[dependencies]
animus-launch = { workspace = true }
ferric-bench = { workspace = true }
ferric-core = { workspace = true }
ferric-guard = { workspace = true }
ferric-loop = { workspace = true }
ferric-prompt = { workspace = true }
ferric-provider = { workspace = true }
ferric-research = { workspace = true }
ferric-tools = { workspace = true }
ferric-trace = { workspace = true }
clap = { workspace = true }
futures-executor = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, optional = true }
toml = { workspace = true }
rustyline = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
async-trait = { workspace = true }
