[package]
name = "ferric-cli"
description = "The ferric binary"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ferric"
path = "src/main.rs"

[features]
default = []
backend-mistralrs = ["ferric-provider/backend-mistralrs", "dep:tokio"]

[dependencies]
ferric-core = { workspace = true }
ferric-guard = { workspace = true }
ferric-loop = { workspace = true }
ferric-provider = { workspace = true }
ferric-tools = { workspace = true }
ferric-trace = { workspace = true }
clap = { workspace = true }
futures-executor = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
