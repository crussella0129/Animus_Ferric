[package]
name = "ferric-cli"
description = "The ferric binary"
default-run = "ferric"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ferric"
path = "src/main.rs"

[[bin]]
name = "ferric-lifecycle-fixture"
path = "src/bin/ferric_lifecycle_fixture.rs"
required-features = ["lifecycle-fixture"]

[features]
default = []

# Test-only model-free stand-in for llama-server. The required-feature binary
# target keeps it out of normal/release Ferric builds.
lifecycle-fixture = []

backend-openai = [
    "ferric-provider/backend-openai",
    "dep:axum",
    "dep:reqwest",
    "dep:tokio-stream",
]

[dependencies]
animus-launch = { workspace = true }
ferric-bench = { workspace = true }
ferric-icm = { workspace = true }
ferric-core = { workspace = true }
ferric-cron = { workspace = true }
ferric-guard = { workspace = true }
ferric-loop = { workspace = true }
ferric-prompt = { workspace = true }
ferric-provider = { workspace = true }
ferric-research = { workspace = true }
ferric-tools = { workspace = true }
ferric-skills = { workspace = true }
ferric-trace = { workspace = true }
ferric-vcs = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
futures-executor = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true }
toml = { workspace = true }
tempfile = { workspace = true }
rustyline = { workspace = true }
reqwest = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
async-trait = { workspace = true }
