[package]
name = "ferric-cli"
description = "The ferric binary"
default-run = "ferric"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ferric"
path = "src/main.rs"

[[bin]]
name = "ferric-lifecycle-fixture"
path = "src/bin/ferric_lifecycle_fixture.rs"
required-features = ["lifecycle-fixture"]

[[bin]]
name = "ferric-lifecycle-test"
path = "src/main.rs"
required-features = ["lifecycle-fixture"]
test = false
bench = false

[features]
default = ["backend-openai"]

# Test-only model-free stand-in for llama-server. The required-feature binary
# target keeps it out of normal/release Ferric builds.
lifecycle-fixture = []

backend-openai = [
    "ferric-provider/backend-openai",
    "dep:axum",
    "dep:reqwest",
    "dep:tokio-stream",
]

[dependencies]
animus-launch = { workspace = true }
ferric-bench = { workspace = true }
ferric-icm = { workspace = true }
ferric-core = { workspace = true }
ferric-cron = { workspace = true }
ferric-guard = { workspace = true }
ferric-loop = { workspace = true }
ferric-prompt = { workspace = true }
ferric-provider = { workspace = true }
ferric-process = { workspace = true }
ferric-research = { workspace = true }
ferric-tools = { workspace = true }
ferric-skills = { workspace = true }
ferric-trace = { workspace = true }
ferric-vcs = { workspace = true }
clap = { workspace = true }
cap-std = "4"
cap-fs-ext = "4"
tokio = { workspace = true }
futures-executor = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true }
toml = { workspace = true }
tempfile = { workspace = true }
rustyline = { workspace = true }
reqwest = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# GlobalMemoryStatusEx for the front door's hardware-fit probe (startup/memory.rs).
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = { workspace = true }
async-trait = { workspace = true }
