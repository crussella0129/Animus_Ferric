[package]
name = "ferric-gate"
description = "The network boundary for Ferric's local HTTP services: per-launch bearer tokens, anti-DNS-rebinding Host checks, browser refusal, and the WireGuard (GotaTun) tunnel plan"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
x25519-dalek = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros"] }
tower = { version = "0.5", features = ["util"] }
