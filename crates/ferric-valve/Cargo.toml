[package]
name = "ferric-valve"
description = "OpenAI-compatible constrained valve: Ferric's harness-owned decoding between Hermes Agent and a llama.cpp backend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ferric-valve"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
clap = { workspace = true }
ferric-iron = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-stream = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
