name = "ttl-cache-through-service"
category = "long_horizon"
prompt = "Complete cache.py and service.py. TtlCache(clock) stores values with set(key,value,ttl_s), rejects negative ttl, treats ttl 0 as immediately expired, and get(key) returns None while removing expired entries. delete(key) returns whether a live or expired entry existed. Service.get_or_load(key, loader, ttl_s) returns cached values without calling loader and otherwise loads once, caches, and returns the result. None is a valid cached value, so distinguish a cache miss. Keep the clock injectable and use only the standard library. Run the authorized check and call task_complete."
max_turns = 30
timeout_s = 840

[tasks.setup_files]
"cache.py" = '''
import time

class TtlCache:
    def __init__(self, clock=time.monotonic):
        self.clock = clock
        self.items = {}

    def set(self, key, value, ttl_s):
        self.items[key] = value

    def get(self, key):
        return self.items.get(key)

    def delete(self, key):
        return self.items.pop(key, None) is not None
'''
"service.py" = '''
class Service:
    def __init__(self, cache):
        self.cache = cache

    def get_or_load(self, key, loader, ttl_s):
        value = self.cache.get(key)
        if value is None:
            value = loader()
            self.cache.set(key, value, ttl_s)
        return value
'''

