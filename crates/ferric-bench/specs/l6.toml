version = 2
level = 6
name = "full-todo-app"
prompt = "Build a TODO CLI in todo.py with three subcommands: add <text>, list, done <id>. Persist todos to ./todos.json as a JSON array of objects with integer id, string text, and boolean done fields; IDs start at 1 and increase. The list command prints one line per todo containing its id, a [ ] or [x] completion marker, and its text. Use argparse. Then create tests/test_todo.py using Python's standard-library unittest. Then call task_complete."
max_turns = 25
timeout_s = 900
expected_tools = ["task_complete", "write_file"]
any_of_tools = []
forbidden_tools = []

[[expectations]]
path = "todo.py"
type = "file"
content_regex = "argparse"

[[expectations]]
path = "todo.py"
type = "file"
content_regex = "todos\\.json"

[[expectations]]
path = "tests/test_todo.py"
type = "file"

[[checks]]
name = "todo-and-test-compile"
argv = ["{python}", "-m", "py_compile", "todo.py", "tests/test_todo.py"]
timeout_s = 15

[[checks]]
name = "clean-todo-state"
argv = ["{python}", "-c", "from pathlib import Path; p = Path('todos.json'); p.unlink() if p.exists() else None"]
timeout_s = 15

[[checks]]
name = "add-first-todo"
argv = ["{python}", "todo.py", "add", "alpha"]
timeout_s = 15

[[checks]]
name = "add-second-todo"
argv = ["{python}", "todo.py", "add", "beta"]
timeout_s = 15

[[checks]]
name = "list-shows-both-todos"
argv = ["{python}", "todo.py", "list"]
stdout_regex = '(?s)(alpha.*beta|beta.*alpha)'
timeout_s = 15

[[checks]]
name = "complete-first-todo"
argv = ["{python}", "todo.py", "done", "1"]
timeout_s = 15

[[checks]]
name = "list-shows-completed-marker"
argv = ["{python}", "todo.py", "list"]
stdout_regex = '(?m)^.*1.*\[x\].*alpha'
timeout_s = 15

[[checks]]
name = "persisted-state-is-correct"
argv = ["{python}", "-c", "import json; data = json.load(open('todos.json', encoding='utf-8')); assert any(item.get('id') == 1 and item.get('text') == 'alpha' and item.get('done') is True for item in data); assert any(item.get('id') == 2 and item.get('text') == 'beta' and item.get('done') is False for item in data)"]
timeout_s = 15

[[checks]]
name = "clean-state-before-generated-tests"
argv = ["{python}", "-c", "from pathlib import Path; p = Path('todos.json'); p.unlink() if p.exists() else None"]
timeout_s = 15

[[checks]]
name = "generated-unittest-passes"
argv = ["{python}", "-m", "unittest", "discover", "-s", "tests"]
timeout_s = 30
