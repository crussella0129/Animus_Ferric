version = 2
level = 5
name = "mini-cli"
prompt = "Create a Python CLI in cli.py that uses argparse to accept a --name argument and prints 'Hello, <name>!' to stdout. Then create tests/test_cli.py using Python's standard-library unittest. Then call task_complete."
max_turns = 18
timeout_s = 600
expected_tools = ["task_complete", "write_file"]
any_of_tools = []
forbidden_tools = []

[[expectations]]
path = "cli.py"
type = "file"
content_regex = "argparse"

[[expectations]]
path = "cli.py"
type = "file"
content_regex = "Hello"

[[expectations]]
path = "tests/test_cli.py"
type = "file"

[[checks]]
name = "cli-and-test-compile"
argv = ["{python}", "-m", "py_compile", "cli.py", "tests/test_cli.py"]
timeout_s = 15

[[checks]]
name = "generated-unittest-passes"
argv = ["{python}", "-m", "unittest", "discover", "-s", "tests"]
timeout_s = 30

[[checks]]
name = "cli-greets-name"
argv = ["{python}", "cli.py", "--name", "Ferric"]
stdout_regex = '^Hello, Ferric!\r?\n?$'
timeout_s = 15
