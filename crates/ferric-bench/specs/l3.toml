version = 2
level = 3
name = "single-file-construction"
prompt = "Create a Python file greet.py containing a single function hello() that returns the string 'world'. Then call task_complete."
max_turns = 8
timeout_s = 180
expected_tools = ["task_complete", "write_file"]
any_of_tools = []
forbidden_tools = []

[[expectations]]
path = "greet.py"
type = "file"
content_regex = "def\\s+hello\\s*\\([^)]*\\)\\s*:"

[[expectations]]
path = "greet.py"
type = "file"
content_regex = "['\"]world['\"]"

[[checks]]
name = "greet-compiles"
argv = ["{python}", "-m", "py_compile", "greet.py"]
timeout_s = 15

[[checks]]
name = "greet-returns-world"
argv = ["{python}", "-c", "import greet; assert greet.hello() == 'world'"]
timeout_s = 15
