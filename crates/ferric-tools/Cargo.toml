[package]
name = "ferric-tools"
description = "Tool trait, registry chokepoint, and builtin file tools for Animus Ferric"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cap-fs-ext = "4"
cap-std = "4"
ferric-core = { workspace = true }
ferric-guard = { workspace = true }
getrandom = "0.4"
rustpython-parser = { version = "0.4", default-features = false, features = ["location", "num-bigint"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
ferric-trace = { workspace = true }
tempfile = { workspace = true }
