[package]
name = "ferric-tools"
description = "Tool trait, registry chokepoint, and builtin file tools for Animus Ferric"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cap-fs-ext = { workspace = true }
cap-std = { workspace = true }
ferric-core = { workspace = true }
ferric-guard = { workspace = true }
ferric-iron = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
rustpython-compiler = "0.5"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
ferric-trace = { workspace = true }
tempfile = { workspace = true }
