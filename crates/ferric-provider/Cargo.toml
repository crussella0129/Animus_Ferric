[package]
name = "ferric-provider"
description = "Async Provider trait with constraint plumbing, plus the deterministic MockProvider"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
backend-mistralrs = ["dep:mistralrs"]
backend-openai = ["dep:reqwest"]

[dependencies]
ferric-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
mistralrs = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["json"] }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
ferric-guard = { workspace = true }
ferric-tools = { workspace = true }
ferric-trace = { workspace = true }
futures-executor = { workspace = true }
tempfile = { workspace = true }
# Test-only: the grammar_probe diagnostic needs an ambient runtime to drive
# the mistralrs client (matches query.rs). Dev-dep only — not in the default
# library graph or the aarch64 check gate.
tokio = { workspace = true }
