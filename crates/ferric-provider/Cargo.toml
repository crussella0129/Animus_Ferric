[package]
name = "ferric-provider"
description = "Async Provider trait with constraint plumbing, plus the deterministic MockProvider"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []

backend-openai = ["dep:reqwest", "dep:tracing"]

[dependencies]
ferric-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
# Only the openai HTTP valve is instrumented, so tracing rides the same feature
# — the default/aarch64 library build never compiles it (sprint 72, ADR-063).
tracing = { workspace = true, optional = true }

reqwest = { workspace = true, optional = true, features = ["json"] }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
ferric-guard = { workspace = true }
ferric-tools = { workspace = true }
ferric-trace = { workspace = true }
futures-executor = { workspace = true }
tempfile = { workspace = true }
# Test-only tokio: the `backend-openai` streaming E2E test spins up a real
# `tokio::net::TcpListener` fake server and uses `#[tokio::test]`. Dev-dep only
# — not in the default library graph or the aarch64 check gate. `net`/`macros`
# (sprint 37, ADR-047) are NOT needed by `complete_streaming`'s production path
# (it reads via `Response::chunk()`, which needs no `stream` feature and no
# `tokio::net`).
tokio = { workspace = true, features = ["net", "macros", "io-util"] }
