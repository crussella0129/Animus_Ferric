name: CI

on:
  push:
    # `dev` runs establish immutable pre-PR Sprint evidence; `main` retains
    # the post-merge regression gate.
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace

  # Compile-checks the feature-gated openai backend so cfg-gated code
  # cannot rot behind -D warnings. Linux-only to bound CI minutes; Windows
  # CPU is CI-verified upstream and exercised daily on the dev machine.
  backend-check:
    name: backend-openai clippy (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: clippy with backend-openai
        run: cargo clippy -p ferric-cli --features backend-openai --all-targets -- -D warnings

  # Runs the model-free lifecycle fixture on both supported CI hosts. Tests are
  # serialized because they exercise process, listener, and runfile ownership
  # boundaries. On Linux, the positive-path fixture gets an isolated PID,
  # network, and proc namespace so every relevant peer is visible to the
  # capability-free runner identity. Deterministic tests separately prove that
  # an uninspectable peer remains non-authorizing in the production classifier.
  lifecycle-fixture:
    name: lifecycle fixture (${{ matrix.os }})
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: clippy lifecycle fixture
        run: cargo clippy -p ferric-cli --features lifecycle-fixture --all-targets --locked -- -D warnings
      - name: test lifecycle fixture serially (Windows)
        if: runner.os == 'Windows'
        run: cargo test -p ferric-cli --features lifecycle-fixture --test server_lifecycle_fixture --locked -- --test-threads=1
      - name: build lifecycle fixture test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test_bin="$(
            cargo test -p ferric-cli --features lifecycle-fixture \
              --test server_lifecycle_fixture --locked --no-run \
              --message-format=json |
            jq -sr '
              [
                .[] |
                select(.reason == "compiler-artifact" and
                       .target.name == "server_lifecycle_fixture" and
                       .profile.test == true) |
                .executable // empty
              ] as $executables |
              if ($executables | length) == 1 then
                $executables[0]
              else
                error("expected exactly one lifecycle fixture executable")
              end
            '
          )"
          test -n "$test_bin"
          test_bin="$(realpath "$test_bin")"
          test -x "$test_bin"
          printf '%s\n' "$test_bin" > "$RUNNER_TEMP/ferric-lifecycle-test-bin"
      - name: test lifecycle fixture serially (isolated non-root Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test_bin="$(cat "$RUNNER_TEMP/ferric-lifecycle-test-bin")"
          test -x "$test_bin"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          sudo -n unshare --pid --net --fork --mount-proc \
            --kill-child=SIGKILL \
            /bin/sh -ceu '
              ip link set lo up
              # Keep an unprivileged shell as namespace PID 1 so it reaps
              # adopted fixture children between serialized tests. Never exec
              # the Rust harness as PID 1: exited managed children would remain
              # zombies and poison later /proc listener-owner queries.
              # Credential changes clear PDEATHSIG unless setpriv restores it;
              # retain the unshare --kill-child hard-cleanup contract.
              exec setpriv --pdeathsig keep \
                --reuid="$1" --regid="$2" --clear-groups \
                --no-new-privs --inh-caps=-all --ambient-caps=-all \
                --bounding-set=-all /bin/sh -ceu \
                "test \"\$\$\" -eq 1; status=0; \"\$1\" --test-threads=1 || status=\$?; exit \"\$status\"" _ "$3"
            ' _ "$runner_uid" "$runner_gid" "$test_bin"

  # Portability gate: Ferric must keep type-checking for Raspberry Pi /
  # Orange Pi / Jetson class aarch64 Linux targets (ADR-004).
  aarch64-check:
    name: aarch64-unknown-linux-gnu check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: add target
        run: rustup target add aarch64-unknown-linux-gnu
      - name: check
        run: cargo check --workspace --target aarch64-unknown-linux-gnu --locked
      - name: check lifecycle fixture (compile only)
        run: cargo check -p ferric-cli --features lifecycle-fixture --all-targets --target aarch64-unknown-linux-gnu --locked
