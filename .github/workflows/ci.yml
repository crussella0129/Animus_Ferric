name: CI

on:
  push:
    # `dev` runs establish immutable pre-PR Sprint evidence; `main` retains
    # the post-merge regression gate.
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + clippy + test (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: rustfmt included human fixtures
        run: rustfmt --edition 2024 --check crates/ferric-cli/src/human_journey_tests.rs
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: workspace tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace --locked
      - name: workspace tests (isolated non-root Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash tools/test-lifecycle-linux.sh workspace

  # Default launch enables the real backend. Keep the explicit backend-free
  # build and its expert mock commands working on both supported CI hosts.
  # Startup and positive human-session fixtures are backend-gated; this job
  # needs neither the namespace workspace mode nor lifecycle-fixture features.
  no-default-features:
    name: CLI without backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: clippy without default features
        run: cargo clippy -p ferric-cli --no-default-features --all-targets --locked -- -D warnings
      - name: test without default features
        run: cargo test -p ferric-cli --no-default-features --locked

  # Compile-checks the feature-gated openai backend so cfg-gated code
  # cannot rot behind -D warnings. Linux-only to bound CI minutes; Windows
  # CPU is CI-verified upstream and exercised daily on the dev machine.
  backend-check:
    name: backend-openai clippy (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: clippy with backend-openai
        run: cargo clippy -p ferric-cli --features backend-openai --all-targets -- -D warnings

  # Runs the model-free lifecycle fixture on both supported CI hosts. Tests are
  # serialized because they exercise process, listener, and runfile ownership
  # boundaries. On Linux, the positive-path fixture gets an isolated PID,
  # network, and proc namespace so every relevant peer is visible to the
  # capability-free runner identity. Deterministic tests separately prove that
  # an uninspectable peer remains non-authorizing in the production classifier.
  lifecycle-fixture:
    name: lifecycle fixture (${{ matrix.os }})
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: clippy lifecycle fixture
        run: cargo clippy -p ferric-cli --features lifecycle-fixture --all-targets --locked -- -D warnings
      - name: test lifecycle fixture serially (Windows)
        if: runner.os == 'Windows'
        run: cargo test -p ferric-cli --features lifecycle-fixture --test server_lifecycle_fixture --locked -- --test-threads=1
      - name: test lifecycle fixture serially (isolated non-root Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash tools/test-lifecycle-linux.sh

  # Portability gate: Ferric must keep type-checking for Raspberry Pi /
  # Orange Pi / Jetson class aarch64 Linux targets (ADR-004).
  aarch64-check:
    name: aarch64-unknown-linux-gnu check
    runs-on: ubuntu-latest
    env:
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: add target
        run: rustup target add aarch64-unknown-linux-gnu
      - name: install aarch64 C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: check
        run: cargo check --workspace --target aarch64-unknown-linux-gnu --locked
      - name: check lifecycle fixture (compile only)
        run: cargo check -p ferric-cli --features lifecycle-fixture --all-targets --target aarch64-unknown-linux-gnu --locked
