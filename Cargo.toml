[workspace]
resolver = "3"
default-members = ["crates/ferric-cli"]
members = [
    "crates/ferric-core",
    "crates/ferric-iron",
    "crates/ferric-process",
    "crates/ferric-trace",
    "crates/ferric-provider",
    "crates/ferric-guard",
    "crates/ferric-tools",
    "crates/ferric-loop",
    "crates/ferric-bench",
    "crates/ferric-research",
    "crates/ferric-cli",
    "crates/ferric-valve",
    "crates/ferric-gate",
    "crates/ferric-setup",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/crussella0129/Animus_Ferric"

# Dependency allowlist (ADR-004, amended s1): the s0 set plus clap (the CLI),
# rustyline (the chat REPL) and tokio (the runtime the OpenAI HTTP backend, the
# valve and the CLI drive).
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order is LOAD-BEARING (ADR-016): llguidance emits JSON-schema
# properties in document order, and the action grammar requires "tool" before
# "args" for early branch commitment. Default BTreeMap ordering would emit
# "args" first.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }

# rustls-tls (sprint 35, ADR-045): default-tls pulls native OpenSSL bindings on
# non-Windows targets -- a native dependency + cross-toolchain burden for ARM
# edge cross-compilation (Jetson/RPi). rustls is pure Rust; Ferric only ever
# talks to 127.0.0.1 (ADR-005) so TLS itself is barely exercised regardless.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "time", "macros", "signal"] }
# Prompt composition (ADR-016): rev-pinned to oovra main.
oovra = { git = "https://github.com/crussella0129/oovra", rev = "378abea6552f74ee7a8e4d9ce74418d6457ad002" }
toml = "1.1"
regex = "1"
tempfile = "3"
sha2 = "0.11"
# digest 0.11's output no longer implements LowerHex; use the RustCrypto
# ecosystem's canonical byte-to-lowercase-hex encoder instead.
hex = "0.4"
# Crash-safe external ownership coordinates use one OS-CSPRNG draw. Keeping
# the dependency at the workspace boundary makes the 128-bit contract
# explicit and available to the CLI without a platform-specific RNG shim.
getrandom = "0.4"
futures-executor = "0.3"
rustyline = "18"
axum = "0.8"
tokio-stream = "0.1"

# Observability (sprint 72, ADR-063): leveled, structured harness-internal
# logging, DISTINCT from the LLM JSONL trajectory (ADR-002). `tracing` is the
# emit-side facade (pure Rust, no C deps — edge/ARM-clean); only the binary
# (`ferric-cli`) links `tracing-subscriber` and installs a stderr subscriber,
# so libraries stay subscriber-agnostic. With no subscriber the macros are
# near-zero-cost, so it ships always-on rather than feature-gated.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Unix Tailscale LocalAPI transport uses poll/read/write with one absolute
# deadline over the daemon's Unix-domain socket.
libc = "0.2"

# Native Windows process ownership and explicit test-harness containment.
windows-sys = "0.61"

# Capability-based, no-follow filesystem access for the workspace tools and
# Ferric's own state directories.
cap-std = "4"
cap-fs-ext = "4"

# Calendar cron expressions (sprint 76, ADR-067): epoch→UTC civil-time
# decomposition for evaluating 5-field cron schedules. Already in the tree via
# oovra (and CI-gated on aarch64 through ferric-cli), so this is a zero-new-cost
# allowlist addition; used only by `ferric cron` (ferric-cli).
chrono = "0.4"

# Network boundary (sprint 127, INT-0015). `x25519-dalek` derives WireGuard
# public keys for the self-hosted GotaTun tunnel plan; it is the curve
# implementation BoringTun/GotaTun themselves use, pure Rust, and ring (already
# in-tree via rustls) cannot export a static X25519 secret. `base64` is the
# WireGuard key encoding and is already in the tree transitively.
x25519-dalek = { version = "2", features = ["static_secrets"] }
base64 = "0.22"

ferric-core = { path = "crates/ferric-core" }
ferric-gate = { path = "crates/ferric-gate" }
ferric-setup = { path = "crates/ferric-setup" }
ferric-iron = { path = "crates/ferric-iron" }
ferric-process = { path = "crates/ferric-process" }
ferric-trace = { path = "crates/ferric-trace" }
ferric-provider = { path = "crates/ferric-provider" }
ferric-guard = { path = "crates/ferric-guard" }
ferric-tools = { path = "crates/ferric-tools" }
ferric-loop = { path = "crates/ferric-loop" }
ferric-bench = { path = "crates/ferric-bench" }
ferric-research = { path = "crates/ferric-research" }
ferric-valve = { path = "crates/ferric-valve" }
