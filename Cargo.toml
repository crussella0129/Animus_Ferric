[workspace]
resolver = "3"
members = [
    "crates/ferric-core",
    "crates/ferric-trace",
    "crates/ferric-provider",
    "crates/ferric-guard",
    "crates/ferric-tools",
    "crates/ferric-loop",
    "crates/ferric-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/crussella0129/Animus_Ferric"

# Dependency allowlist (ADR-004, amended s1): the s0 set plus — clap (the CLI
# surface is real now), and feature-gated mistralrs + tokio (default OFF: the
# default workspace build and the aarch64 check gate never compile them).
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
mistralrs = "=0.8.1"
tokio = { version = "1", features = ["rt-multi-thread"] }
tempfile = "3"
futures-executor = "0.3"

ferric-core = { path = "crates/ferric-core" }
ferric-trace = { path = "crates/ferric-trace" }
ferric-provider = { path = "crates/ferric-provider" }
ferric-guard = { path = "crates/ferric-guard" }
ferric-tools = { path = "crates/ferric-tools" }
ferric-loop = { path = "crates/ferric-loop" }
