[workspace]
resolver = "3"
members = [
    "crates/ferric-core",
    "crates/ferric-trace",
    "crates/ferric-provider",
    "crates/ferric-guard",
    "crates/ferric-tools",
    "crates/ferric-loop",
    "crates/ferric-prompt",
    "crates/ferric-bench",
    "crates/ferric-research",
    "crates/animus-launch",
    "crates/ferric-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/crussella0129/Animus_Ferric"

# Dependency allowlist (ADR-004, amended s1): the s0 set plus — clap (the CLI
# surface is real now), rustyline (for the chat REPL), and feature-gated 
# mistralrs + tokio (default OFF: the default workspace build and the aarch64 
# check gate never compile them).
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order is LOAD-BEARING (ADR-016): llguidance emits JSON-schema
# properties in document order, and the action grammar requires "tool" before
# "args" for early branch commitment. Default BTreeMap ordering would emit
# "args" first.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }

# rustls-tls (sprint 35, ADR-045): default-tls pulls native OpenSSL bindings on
# non-Windows targets -- a native dependency + cross-toolchain burden for ARM
# edge cross-compilation (Jetson/RPi). rustls is pure Rust; Ferric only ever
# talks to 127.0.0.1 (ADR-005) so TLS itself is barely exercised regardless.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
# Prompt composition (ADR-016): rev-pinned to oovra main; immutable until a
# deliberate, reviewed bump. Swap to crates.io at oovra v0.3.
oovra = { git = "https://github.com/crussella0129/oovra", rev = "378abea6552f74ee7a8e4d9ce74418d6457ad002" }
toml = "0.8"
regex = "1"
tempfile = "3"
futures-executor = "0.3"
rustyline = "14"

ferric-core = { path = "crates/ferric-core" }
ferric-trace = { path = "crates/ferric-trace" }
ferric-provider = { path = "crates/ferric-provider" }
ferric-guard = { path = "crates/ferric-guard" }
ferric-tools = { path = "crates/ferric-tools" }
ferric-loop = { path = "crates/ferric-loop" }
ferric-prompt = { path = "crates/ferric-prompt" }
ferric-bench = { path = "crates/ferric-bench" }
ferric-research = { path = "crates/ferric-research" }
animus-launch = { path = "crates/animus-launch" }
