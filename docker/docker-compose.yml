# Animus platform topology — SIBLING containers, not Docker-in-Docker (ADR-051,
# sprint 41). This is a design skeleton: only `ferric-core` is a real,
# buildable service; the others are STUBS marking where future sprints land.
#
# Two problems, two tools (ADR-051):
#   - Deployment flexibility (one machine → datacenter): sibling services here,
#     Kubernetes-ready later. That's what this file is.
#   - Untrusted-content isolation (Ornstein's "airlock"): a microVM-class
#     sandbox (Docker Sandboxes / gVisor), NOT nested Docker — a separate
#     concern from this topology, sequenced in a later sprint.
#
# `ferric` + its inference backend (llama-server) are CO-LOCATED in the single
# `ferric-core` image (ADR-005 loopback-only pin — see docker/Dockerfile), never
# split across containers.

services:
  # The one real service: the harness + its co-located inference backend.
  ferric-core:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # Idle so the container can be exec'd into. `command:` alone CANNOT do this:
    # the image sets `ENTRYPOINT ["ferric"]`, so `command: tail -f /dev/null`
    # ran `ferric tail -f /dev/null` → "unrecognized subcommand" → exit →
    # `restart: unless-stopped` → a crash loop that ran from 2026-07-14 until
    # sprint 96 found it. Overriding `entrypoint` is what actually detaches the
    # idle command from the binary.
    entrypoint: ["sleep"]
    command: ["infinity"]
    # Run a real init as PID 1 (docker injects tini). `sleep` does not reap, so
    # without this every process orphaned in here becomes a permanent zombie —
    # measured: killing the in-container llama-server left it `state=Z ppid=1`
    # indefinitely, and a zombie still answers `kill -0`, so `ferric server
    # down` saw a dead process as running (sprint 96).
    init: true
    # The workspace the harness acts on (ferric-guard + ADR-005 remain the real
    # containment boundary inside the container; the mount is just what `ferric
    # query` operates against).
    volumes:
      - ../workspace:/workspace
      # The shared Animus model store: one GGUF directory for the whole suite
      # rather than a copy per component. Sibling to this repo, so the default
      # works on a standard checkout layout. Override with MODELS_PATH in a
      # local `.env` (see .env.example) if yours lives elsewhere — that file is
      # gitignored now, because it used to be tracked with an absolute NAS path
      # that broke `up` on any machine without the drive mapped (sprint 96).
      - ${MODELS_PATH:-../../Animus/Models}:/models
    # NO docker socket mount. It was here for the sprint-45 design in which
    # ferric launched sibling fetch containers, and it was **doubly
    # non-functional**: the image ships no docker CLI, and the socket is
    # root:root 0660 while the container runs as uid 10001 (both measured,
    # sprint 96). What it did do is stage a host-root-equivalent escape for
    # whoever later added a docker client or switched to root — mounting the
    # socket into the container that handles untrusted content defeats the
    # airlock it sits next to. The airlock runs on the HOST, from
    # `ferric-research`, and needs nothing here.
    # Reachability for future sibling services is intentionally a COMMENT, not a
    # live `ports:`/`networks:` directive (ADR-051): the Dockerfile publishes no
    # port and binds llama-server to loopback INSIDE the container only. When
    # Ornstein/chat become real services that need to reach ferric-core, an
    # internal Docker network (not a host-published port) is the intended path —
    # decided in the sprint that operationalizes them, not here.
    restart: unless-stopped

  # REMOVED (sprint 96): `allowlist-proxy`, a static squid on a bridge network.
  #
  # It was the sprint-45 egress design (ADR-055). ADR-082 superseded it, and not
  # cosmetically: a proxy on a **bridge** network is bypassable — the sandbox
  # keeps a route to the outside, so `unset http_proxy && wget …` walks straight
  # past it. That bypass is now a test.
  #
  # Ornstein instead builds its airlock at runtime (`ferric-research::airlock`):
  # an `--internal` network with NO route out, a tinyproxy gateway attached to
  # both sides, and an allowlist derived from the URLs actually requested — not
  # a hardcoded `.example.com`/`.wikipedia.org` pair that drifts from what the
  # code fetches. It is created and torn down per run, so there is nothing for
  # compose to hold.
  #
  # Leaving the service here would have published a known-defeated topology as
  # the platform's egress story. `docker/squid.conf` is deleted with it.

# STUB — the raw chat surface (ADR-011 revision's unbuilt half). Its own build
